[workspace]
members = ["crates/life", "crates/llm-life"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
wasm-bindgen = "0.2"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

# llm-wasm is a git dependency on idle-intelligence/llm-web, whose
# [patch.crates-io] does NOT follow a git dependency into another
# workspace — this build resolves patches from here. The cubecl-wgpu patch
# caps workgroup size at WebGPU's 256-invocation browser limit; without it
# the wasm build emits shaders Chromium refuses. Vendored verbatim from
# llm-web's patches/cubecl-wgpu-0.9.0.
[patch.crates-io]
cubecl-wgpu = { path = "patches/cubecl-wgpu-0.9.0" }
