[package]
name = "llm-life-lean"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The language-model methods of llm-life on lean, the project's raw wgpu + WGSL engine"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "llm-life"
required-features = ["native"]

[features]
default = ["native"]
# Backend selection lives here, in the consumer crate: pollster blocks on
# the async load natively, lean's `wasm` switches wgpu to WebGPU, lean's
# `threads` runs the native CPU backend on every core.
native = ["dep:pollster", "dep:clap", "lean/threads"]
web = [
    "lean/wasm",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:web-sys",
    "dep:console_error_panic_hook",
]
# Threaded CPU backend for the browser: lean's `threads` (rayon over the
# matmul columns) plus wasm-bindgen-rayon's worker pool (`initThreadPool`).
# Needs the nightly atomics build (scripts/build.sh with BUILD_THREADS=1)
# and a cross-origin-isolated page (COOP/COEP).
web-mt = ["web", "lean/threads", "dep:wasm-bindgen-rayon"]

[dependencies]
life = { path = "../life" }
llm-life = { path = "../llm-life" }
# The engine's forward pass: crates/lean-core in idle-intelligence/llm-web
# (positions, masks, sliced head, KV cache, LoRA), pinned to a rev.
lean = { package = "lean-core", git = "https://github.com/idle-intelligence/llm-web", rev = "6a4bb25b4c8df457c0e7572b6e565060d9505ac8", default-features = false }
anyhow = { workspace = true }
wgpu = "26"
pollster = { version = "0.3", optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", features = ["console"], optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

# Same tokenizer build as lean's own (onig/esaxx_fast are not wasm32-safe).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokenizers = { version = "0.22", default-features = false, features = ["unstable_wasm", "fancy-regex"] }
getrandom = { version = "0.3", default-features = false, features = ["wasm_js"] }
wasm-bindgen-rayon = { version = "1.3", optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
