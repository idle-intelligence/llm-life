[package]
name = "llm-life"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A language model as the update rule of a cellular automaton"

[[bin]]
name = "llm-life"
path = "src/bin/llm-life.rs"
required-features = ["native"]

# One-shot bridge for the PyTorch training migration: dumps the published
# Burn checkpoints (tiny models + LoRA adapters) to safetensors, plus fixed-
# input oracle logits so the PyTorch port can be checked byte-for-byte
# against the exact weights the Rust trainer produced. Not part of the
# ongoing build; run once per checkpoint set.
[[bin]]
name = "export"
path = "src/bin/export.rs"
required-features = ["native", "cpu", "export"]

[features]
default = ["native"]
# Backend/feature selection lives in the consumer crate, not the library
# (CLAUDE.md "Code"): llm-wasm's own `native` feature pulls wgpu + the
# native tokenizer.
native = ["llm-wasm/native", "dep:clap"]
web = [
    "llm-wasm/web",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]
# CPU backend for BERT of Life's ns/cell laptop measurement — burn-ndarray,
# not wgpu, so it never touches the M2's shared GPU (CLAUDE.md "GPU and
# measurements"). Consumer-crate-only, per CLAUDE.md "Code".
cpu = ["burn/ndarray"]
export = ["dep:safetensors", "dep:serde_json"]

[dependencies]
life = { path = "../life" }
# The engine, from idle-intelligence/llm-web on GitHub, pinned to the
# commit its PR #1/#2 merged at.
llm-wasm = { git = "https://github.com/idle-intelligence/llm-web", rev = "11362b995db0d2456676ac4f599dd35d13423788", default-features = false, features = ["wgpu"] }
# Types only (WgpuDevice, Tensor) — the wgpu backend feature is unified in
# from llm-wasm, which owns the backend choice.
# `autodiff` is enabled here, in the consumer crate (CLAUDE.md "Code"):
# llm-web's own `burn` has only `std` + the wgpu backend, so
# `burn::backend::Autodiff` would not exist there. Cargo unifies the
# feature into the one `burn` both crates share; nothing in llm-web changes.
burn = { version = "0.20", default-features = false, features = ["std", "autodiff"] }
anyhow = { workspace = true }
wasm-bindgen = { workspace = true, optional = true }
# Required by #[wasm_bindgen] on async methods.
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", features = ["console"], optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
safetensors = { version = "0.4", optional = true }
serde_json = { version = "1.0", optional = true }

[lib]
crate-type = ["cdylib", "rlib"]
