[package]
name = "llm-life"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A language model as the update rule of a cellular automaton"

[[bin]]
name = "llm-life"
path = "src/bin/llm-life.rs"
required-features = ["native"]

[features]
default = ["native"]
# Backend/feature selection lives in the consumer crate, not the library
# (CLAUDE.md "Code"): llm-wasm's own `native` feature pulls wgpu + the
# native tokenizer.
native = ["llm-wasm/native", "dep:clap"]
web = [
    "llm-wasm/web",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]
# CPU backend for BERT of Life's ns/cell laptop measurement — burn-ndarray,
# not wgpu, so it never touches the M2's shared GPU (CLAUDE.md "GPU and
# measurements"). Consumer-crate-only, per CLAUDE.md "Code".
cpu = ["burn/ndarray"]

[dependencies]
life = { path = "../life" }
# The engine, from idle-intelligence/llm-web on GitHub, pinned to the
# commit its PR #1/#2 merged at.
llm-wasm = { git = "https://github.com/idle-intelligence/llm-web", rev = "11362b995db0d2456676ac4f599dd35d13423788", default-features = false, features = ["wgpu"] }
# Types only (WgpuDevice, Tensor) — the wgpu backend feature is unified in
# from llm-wasm, which owns the backend choice.
burn = { version = "0.20", default-features = false, features = ["std"] }
anyhow = { workspace = true }
wasm-bindgen = { workspace = true, optional = true }
# Required by #[wasm_bindgen] on async methods.
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", features = ["console"], optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }

[dev-dependencies]
# Pinned to the exact versions already in Cargo.lock (via burn-wgpu):
# probes for a wgpu adapter in grid_batch_parity.rs so the GPU tests skip
# where there is none (CI runners), without pulling in any new versions.
wgpu = "=26.0.1"
pollster = "=0.3.0"

[lib]
crate-type = ["cdylib", "rlib"]
